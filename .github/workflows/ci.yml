name: ci

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keeper
          POSTGRES_PASSWORD: keeper
          POSTGRES_DB: keeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: vet
        run: go vet ./...

      - name: test
        env:
          GOPHKEEPER_TEST_DSN: postgres://keeper:keeper@localhost:5432/keeper?sslmode=disable
        run: go test ./... -count=1 -coverpkg=./internal/... -coverprofile=coverage.out

      - name: coverage
        run: go tool cover -func=coverage.out | tail -1
